<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>CloudPaste 宣传图</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1536px; height: 1024px; overflow: hidden; }
  body {
    font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #0f172a;
    background: #f6f7fb;
    position: relative;
  }
  /* 很淡的四色底纹，只做氛围，不抢截图 */
  .bg { position: absolute; inset: 0; overflow: hidden; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .22; }
  .bg .a { width: 520px; height: 520px; left: -120px; top: -140px; background: #6366f1; }
  .bg .b { width: 460px; height: 460px; right: -100px; top: 40px; background: #0ea5e9; }
  .bg .c { width: 520px; height: 520px; right: 260px; bottom: -260px; background: #10b981; }
  .bg .d { width: 360px; height: 360px; left: 120px; bottom: -180px; background: #f97316; opacity: .14; }

  .copy { position: absolute; left: 88px; top: 120px; width: 470px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
  .brand img { width: 56px; height: 56px; }
  .brand span { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  h1 { font-size: 52px; line-height: 1.22; font-weight: 800; letter-spacing: -.02em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #6366f1, #0ea5e9 55%, #10b981);
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { margin-top: 22px; font-size: 19px; line-height: 1.7; color: #475569; }
  .feats { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .feat { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #fff;
          border: 1px solid #e6e8f0; border-radius: 12px; box-shadow: 0 1px 2px #0f172a0a; }
  .feat b { width: 34px; height: 34px; border-radius: 9px; flex: none; }
  .feat strong { display: block; font-size: 16px; }
  .feat small { display: block; font-size: 13px; color: #64748b; margin-top: 2px; }
  .t b { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
  .f b { background: linear-gradient(135deg, #0ea5e9, #6366f1); }
  .x b { background: linear-gradient(135deg, #10b981, #0ea5e9); }
  .m b { background: linear-gradient(135deg, #f97316, #ec4899); }
  .tags { margin-top: 34px; font-size: 14px; color: #64748b; letter-spacing: .04em; }

  .shot { position: absolute; background: #fff; border-radius: 14px; overflow: hidden;
          border: 1px solid #e3e6ef; box-shadow: 0 30px 60px -20px #0f172a40, 0 8px 20px -8px #0f172a26; }
  .shot .bar { height: 30px; background: #f1f3f8; border-bottom: 1px solid #e3e6ef;
               display: flex; align-items: center; gap: 7px; padding: 0 12px; }
  .shot .bar i { width: 10px; height: 10px; border-radius: 50%; background: #d4d8e2; }
  .shot img { display: block; width: 100%; }
  .s1 { left: 620px; top: 96px; width: 780px; height: 600px; }
  .s1 img { height: calc(100% - 30px); object-fit: cover; object-position: top; }
  .s2 { left: 900px; top: 470px; width: 560px; height: 460px; }
  .s2 img { height: calc(100% - 30px); object-fit: cover; object-position: top; }
  .phone { position: absolute; left: 560px; top: 420px; width: 270px; height: 560px; border-radius: 38px;
           background: #0f172a; padding: 10px; box-shadow: 0 30px 60px -18px #0f172a59; }
  .phone div { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: #fff; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
  <div class="bg"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>

  <section class="copy">
    <div class="brand"><img src="../frontend/public/chain-cloud.svg" alt="" /><span>CloudPaste</span></div>
    <h1>轻盈分享，<br />让文字与文件<br /><em>即刻抵达</em></h1>
    <p class="lead">可自托管的临时文本与文件分享站。有效期、访问密码与查看次数随心设置，还能在两台设备间直接互传。</p>
    <div class="feats">
      <div class="feat t"><b></b><span><strong>文本分享</strong><small>Markdown 编辑与预览</small></span></div>
      <div class="feat f"><b></b><span><strong>文件分享</strong><small>批量上传，合集链接</small></span></div>
      <div class="feat x"><b></b><span><strong>设备互传</strong><small>4 位配对码，直连或中继</small></span></div>
      <div class="feat m"><b></b><span><strong>管理后台</strong><small>存储、密钥与日志</small></span></div>
    </div>
    <p class="tags">Go + Vue · LOCAL / S3 · Docker 单容器</p>
  </section>

  <div class="shot s1"><div class="bar"><i></i><i></i><i></i></div><img src="../docs/assets/share-light.png" alt="" /></div>
  <div class="shot s2"><div class="bar"><i></i><i></i><i></i></div><img src="../docs/assets/transfer.png" alt="" /></div>
  <div class="phone"><div><img src="../docs/assets/upload-mobile.png" alt="" /></div></div>
</body>
</html>
