name: 构建、检查与发布

on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: "检查通过后发布多架构镜像"
        type: boolean
        default: false
      full_checks:
        description: "运行耗时检查：完整竞态、浏览器和两种容器部署"
        type: boolean
        default: false
  pull_request:
    paths:
      - docs/binary.md
      - docs/releasing.md
      - backend/**
      - frontend/**
      - docker/frontend/**
      - docker/standalone/**
      - scripts/**
      - docker-compose.split.yml
      - docker-compose.yml
      - docker-compose.split.build.yml
      - docker-compose.build.yml
      - .dockerignore
      - .gitattributes
      - .github/workflows/backend.yml
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - docs/binary.md
      - docs/releasing.md
      - backend/**
      - frontend/**
      - docker/frontend/**
      - docker/standalone/**
      - scripts/**
      - docker-compose.split.yml
      - docker-compose.yml
      - docker-compose.split.build.yml
      - docker-compose.build.yml
      - .dockerignore
      - .gitattributes
      - .github/workflows/backend.yml

permissions:
  contents: read

# 普通检查只保留最新提交；发布任务不能中途取消。
concurrency:
  group: cloudpaste-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish_images) }}

jobs:
  go:
    name: 后端检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 获取源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 官方 v6
        with:
          persist-credentials: false
      - name: 准备后端编译环境
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # 官方 v6
        with:
          go-version: 1.27.3
          cache-dependency-path: backend/go.sum
      - name: 检查格式与静态问题
        run: |
          # 标签只作为数据读取；先校验，再允许后续发布任务运行。
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[[:alnum:]][[:alnum:].-]*)?$ ]]
            [[ ${#GITHUB_REF_NAME} -le 100 ]]
          fi
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: 运行后端单元测试
        if: github.event_name != 'workflow_dispatch' || !inputs.full_checks
        run: go test ./... -count=1 -timeout=300s
      - name: 手动运行完整竞态检查
        # 竞态测试会重新编译并重复执行用例，只有明确勾选完整检查时运行。
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        run: go test -race ./... -count=1 -timeout=600s
      - name: 检查可达依赖漏洞
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_checks)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 获取源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 官方 v6
        with:
          persist-credentials: false
      - name: 准备后端编译环境
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # 官方 v6
        with:
          go-version: 1.27.3
          cache-dependency-path: backend/go.sum
      - name: 准备前端构建环境
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # 官方 v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 检查前端逻辑并构建页面
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test:go-upload
          npm run test:security
          node --test tests/transfer-flow.test.mjs tests/transfer-code.test.mjs tests/transfer-device.test.mjs tests/transfer-reconnect.test.mjs tests/audit-date.test.mjs
          npm run build
      - name: 准备内嵌前端资源
        run: |
          node --test scripts/prepare-webui.test.mjs
          node scripts/prepare-webui.mjs
      - name: 检查内嵌页面安全约束
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        working-directory: backend
        run: |
          # 内嵌页面有独立的 CSP 与路由边界；实际程序由二进制任务统一构建。
          go test -tags with_frontend ./internal/webui -count=1
          go vet -tags with_frontend ./internal/webui
      - name: 构建浏览器检查程序
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        working-directory: backend
        run: go build -tags with_frontend -o bin/sharing-standalone ./cmd/cloudpaste
      - name: 安装浏览器测试环境
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 检查一体化二进制的真实浏览器流程
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        working-directory: frontend
        env:
          SHARING_TEST_STANDALONE: '1'
          SHARING_TEST_BINARY: ${{ github.workspace }}/backend/bin/sharing-standalone
        run: npm run test:e2e
      - name: 检查配对、消息与实时文件中继
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        working-directory: frontend
        env:
          TRANSFER_TEST_BINARY: ${{ github.workspace }}/backend/bin/sharing-standalone
        # 互传单元测试已在前端逻辑检查中执行，这里只验证真实浏览器传输。
        run: node tests/transfer-smoke.mjs
      - name: 保存已验证的静态资源供二进制构建复用
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 官方 v7
        with:
          name: cloudpaste-webui-dist
          path: backend/internal/webui/dist
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: 二进制构建（${{ matrix.platform }}）
    needs: [go, frontend]
    # 日常提交检查可运行的程序；手动运行和版本发布才打包全部平台。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-amd64, os: linux, arch: amd64, arm: '' }
          - { platform: linux-arm64, os: linux, arch: arm64, arm: '' }
          - { platform: linux-armv6, os: linux, arch: arm, arm: '6' }
          - { platform: linux-armv5, os: linux, arch: arm, arm: '5' }
          - { platform: linux-loong64, os: linux, arch: loong64, arm: '' }
          - { platform: windows-amd64, os: windows, arch: amd64, arm: '' }
          - { platform: darwin-arm64, os: darwin, arch: arm64, arm: '' }
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 获取源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 官方 v6
        with:
          persist-credentials: false
      - name: 准备后端编译环境
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # 官方 v6
        with:
          go-version: 1.27.3
          cache-dependency-path: backend/go.sum
      - name: 取得同一提交已验证的前端产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 官方 v8
        with:
          name: cloudpaste-webui-dist
          path: backend/internal/webui/dist
      - name: 构建、打包并计算校验值
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          CGO_ENABLED: '0'
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          # 分离版仅提供常用 Linux 架构；完整程序覆盖所有发行平台。
          modes=(standalone)
          if [[ "$RELEASE_PLATFORM" == linux-amd64 || "$RELEASE_PLATFORM" == linux-arm64 ]]; then
            modes+=(backend)
          fi
          for mode in "${modes[@]}"; do
            target="cloudpaste-${RELEASE_PLATFORM}"
            executable=cloudpaste
            if [[ "$mode" == backend ]]; then
              target="cloudpaste-backend-${RELEASE_PLATFORM}"
              executable=cloudpaste-backend
            fi
            if [[ "$GOOS" == windows ]]; then executable=cloudpaste.exe; fi
            tags=()
            if [[ "$mode" == standalone ]]; then tags=(-tags with_frontend); fi
            mkdir -p "bin/release/$target"
            go build "${tags[@]}" -trimpath -ldflags='-s -w' -o "bin/release/$target/$executable" ./cmd/cloudpaste
            chmod 0755 "bin/release/$target/$executable"
            # 压缩包携带可独立阅读的启动说明，保留权限并固定时间与所有者。
            cp ../docs/binary.md "bin/release/$target/README.md"
            cp ../LICENSE "bin/release/$target/LICENSE"
            if [[ "$GOOS" == windows ]]; then
              archive="$target.zip"
              find "bin/release/$target" -exec touch -d "@$epoch" {} +
              (cd bin/release && zip -X -r "$archive" "$target")
            else
              archive="$target.tar.gz"
              tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner -czf "bin/release/$archive" -C bin/release "$target"
            fi
            (cd bin/release && sha256sum "$archive" > "$archive.sha256")
          done
      - name: 上传可下载的二进制及校验文件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 官方 v7
        with:
          name: cloudpaste-binaries-${{ matrix.platform }}
          path: |
            backend/bin/release/*.tar.gz*
            backend/bin/release/*.zip*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  docker:
    name: 容器部署检查（${{ matrix.mode == 'standalone' && '单容器' || '多容器' }}）
    # 镜像发布本身会构建三种镜像；额外的部署重建与回归只在手动完整检查中运行。
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, split]
    env:
      # 仅用于每次新建的 CI 数据目录，不对应真实部署凭证。
      ADMIN_PASSWORD: CI-only-password-12345
      LOCAL_FILES_DIR: ./.go-smoke-files
      # CI 额外加载构建配置，验证当前代码；普通部署只用发布镜像。
      COMPOSE_FILE: ${{ matrix.mode == 'standalone' && 'docker-compose.yml:docker-compose.build.yml' || 'docker-compose.split.yml:docker-compose.split.build.yml' }}
    steps:
      - name: 获取源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 官方 v6
        with:
          persist-credentials: false
      - name: 准备可读写测试目录
        run: |
          mkdir -p data .go-smoke-files
          printf '0123456789' > .go-smoke-files/demo.txt
          sudo chown -R 65532:65532 data .go-smoke-files
          # env_file 使用本次测试的独立配置，不包含真实部署凭据。
          cp backend/.env.example .env
      - name: 检查容器配置并构建测试镜像
        run: |
          docker compose config --quiet
          docker compose up -d --build --pull never --wait --wait-timeout 120
      - name: 检查前后端与核心安全约束
        run: python3 backend/scripts/docker_smoke.py
      - name: 输出失败日志
        if: failure()
        run: docker compose logs --tail=100
      - name: 清理测试容器
        if: always()
        run: docker compose down

  images:
    name: 发布${{ matrix.label }}镜像
    needs: [go, frontend, binaries, docker]
    if: >-
      always() &&
      needs.go.result == 'success' && needs.frontend.result == 'success' &&
      needs.binaries.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped') &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_images) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            label: 后端
            suffix: '-backend'
            platforms: linux/amd64,linux/arm64
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - component: frontend
            label: 前端
            suffix: '-frontend'
            platforms: linux/amd64,linux/arm64
            context: .
            dockerfile: ./docker/frontend/Dockerfile
          - component: standalone
            label: 单容器
            suffix: ''
            platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v5,linux/loong64
            context: .
            dockerfile: ./docker/standalone/Dockerfile
    steps:
      - name: 获取源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 官方 v6
        with:
          persist-credentials: false
      - name: 生成小写镜像名称和发布版本
        id: names
        env:
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repository}${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"
          # 手动构建只发布提交号；正式版本标签才更新版本号及 latest。
          version=""
          stable=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != *-* ]]; then stable=true; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
      - name: 设置多架构构建工具
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # 官方 v4
      - name: 登录镜像仓库
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # 官方 v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签和来源信息
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # 官方 v6
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=${{ steps.names.outputs.version }},enable=${{ steps.names.outputs.version != '' }},priority=900
            type=raw,value=latest,enable=${{ steps.names.outputs.stable == 'true' }}
      - name: 构建并发布多架构镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # 官方 v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=cloudpaste-${{ matrix.component }}
          cache-to: type=gha,scope=cloudpaste-${{ matrix.component }},mode=max

  release:
    name: 发布版本二进制附件
    needs: [binaries, images]
    # 可选容器检查跳过时仍允许发布，但二进制和镜像必须全部成功。
    if: >-
      always() && needs.binaries.result == 'success' && needs.images.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载本次运行的二进制附件
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 官方 v8
        with:
          pattern: cloudpaste-binaries-*
          merge-multiple: true
          path: release-assets
      - name: 校验附件并发布版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          # 完整程序七个平台、独立后端两个平台，全部成功后才能公开。
          archives=()
          for platform in linux-amd64 linux-arm64 linux-armv6 linux-armv5 linux-loong64 windows-amd64 darwin-arm64; do
            extension=tar.gz
            if [[ "$platform" == windows-amd64 ]]; then extension=zip; fi
            archives+=("cloudpaste-${platform}.${extension}")
          done
          archives+=(cloudpaste-backend-linux-amd64.tar.gz cloudpaste-backend-linux-arm64.tar.gz)
          for archive in "${archives[@]}"; do
            test -s "$archive"
            test -s "$archive.sha256"
          done
          sha256sum -c ./*.sha256
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          repository="${GITHUB_REPOSITORY,,}"
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          printf '%s\n\n' 'CloudPaste 完整程序支持 Linux amd64、arm64、armv6、armv5、loong64，Windows amd64 和 macOS arm64。独立后端仅提供 Linux amd64、arm64。Windows 使用 ZIP，其余平台使用 tar.gz，每份附件提供 SHA-256 校验。' > release-notes.md
          printf '源码提交：%s\n\n' "$GITHUB_SHA" >> release-notes.md
          printf '后端镜像：ghcr.io/%s-backend:%s\n' "$repository" "$version" >> release-notes.md
          printf '前端镜像：ghcr.io/%s-frontend:%s\n' "$repository" "$version" >> release-notes.md
          printf '单容器镜像：ghcr.io/%s:%s\n' "$repository" "$version" >> release-notes.md
          printf '\n单容器镜像支持五种 Linux 架构；前端和后端镜像仅支持 Linux amd64、arm64。\n' >> release-notes.md
          # 先创建草稿，全部附件上传成功后再公开；重跑只补缺失附件。
          if ! gh release view "$tag" --json tagName > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --title "$tag" --notes-file release-notes.md
          fi
          existing_assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for archive in "${archives[@]}"; do
            for asset in "$archive" "$archive.sha256"; do
              if ! grep -Fxq "$asset" <<< "$existing_assets"; then
                gh release upload "$tag" "$asset"
              fi
            done
          done
          # 校验真正保存到 Release 的附件，避免中断重跑后出现附件与校验文件不匹配。
          mkdir verified-assets
          gh release download "$tag" --dir verified-assets --pattern 'cloudpaste-*'
          for archive in "${archives[@]}"; do
            test -s "verified-assets/$archive"
            # 已有附件必须与本次产物一致，不能因重跑而公开不匹配的旧文件。
            cmp "$archive.sha256" "verified-assets/$archive.sha256"
          done
          (cd verified-assets && sha256sum -c ./*.sha256)
          gh release edit "$tag" --draft=false --prerelease="$prerelease"
