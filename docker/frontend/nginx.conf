# 日志只记录路径，避免保存下载票据和兼容接口的密码查询参数。
log_format cloudpaste_go '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /dev/stdout cloudpaste_go;

map $http_upgrade $transfer_connection {
    default upgrade;
    '' '';
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 文件大小由 Go 根据实际读取字节校验；代理直接转发，不另存上传副本。
    client_max_body_size 0;
    client_body_timeout 60s;
    large_client_header_buffers 4 32k;
    send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Docker 内部 DNS 动态解析，后端重启后不会固定使用旧容器地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $go_backend http://backend:8787;

    location /api/ {
        proxy_pass $go_backend;
        proxy_http_version 1.1;
        # 保留外部端口，让 WebSocket 的 Origin 与实际访问地址一致。
        proxy_set_header Host $http_host;
        # WebSocket 仅用于配对和控制；普通文件仍走无缓存的 HTTP 流。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $transfer_connection;
        # 覆盖客户端自带的转发头；外层代理须先通过明确的 real_ip 信任名单。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        # 上传接收后还需保存到远程存储，最大总时长由 Go 限制为一小时。
        proxy_read_timeout 3600s;
        # 流式转发，避免大文件进入内存缓存或磁盘临时文件。
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 升级时浏览器必须取得撤销旧预缓存的脚本。
    location = /sw.js { add_header Cache-Control "no-store"; try_files $uri =404; }

    location / {
        # 每次页面响应替换样式 nonce；脚本仍限定同源，不允许任意内联内容。
        sub_filter '__CLOUDPASTE_STYLE_NONCE__' $request_id;
        sub_filter_once off;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' blob: https: http:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }
}
