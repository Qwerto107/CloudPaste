  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="临时文本与文件分享，支持有效期与访问密码"
    />
    <!-- SVG 跟随标签栏配色；ICO 供旧浏览器使用，资源均来自本站。 -->

      rel="icon"
      type="image/x-icon"
      href="/favicon.ico?v=chain-cloud-1"
      data-site-icon
    />

      rel="icon"
      type="image/svg+xml"
      href="/chain-cloud.svg"
      data-site-icon
    />

      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=chain-cloud-1"
    />

    <script src="/config.js"></script>
    <script src="/theme.js"></script>

    <div id="app"></div>
