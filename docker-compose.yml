name: cloudpaste-go

services:
  backend:
    build:
      context: ./backend
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: ${GO_BACKEND_IMAGE:-cloudpaste-backend:local}
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 backend/.env 中设置至少12字节的管理员密码}
      DATA_DIR: /data
      PORT: 8787
      MAX_DOWNLOADS: ${MAX_DOWNLOADS:-8}
      MAX_UPLOADS: ${MAX_UPLOADS:-2}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      MAX_STAGED_SIZE_MB: ${MAX_STAGED_SIZE_MB:-1024}
      GOMEMLIMIT: ${GOMEMLIMIT:-80MiB}
    volumes:
      # 保留既有 Go 项目名和数据卷名，升级目录结构时继续使用原数据。
      - go-data:/data
      - type: bind
        source: ${LOCAL_FILES_DIR:-./files}
        target: /files
        read_only: ${LOCAL_FILES_READ_ONLY:-false}
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: ${GO_FRONTEND_IMAGE:-cloudpaste-frontend:local}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  go-data:
