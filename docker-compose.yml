# 与多容器部署共用 ./data；切换模式前先停止原服务，不要同时运行两种模式。
name: cloudpaste

services:
  standalone:
    image: ghcr.io/qwerto107/cloudpaste:0.7.0
    # 应用参数统一从文件读取，下面仅覆盖容器路径与必需的启动约束。
    env_file: .env
    ports:
      - "127.0.0.1:8081:8787"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置至少12字节的管理员密码}
      DATA_DIR: /data
      PORT: 8787
      GOMEMLIMIT: ${GOMEMLIMIT:-80MiB}
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${LOCAL_FILES_DIR:-./files}
        target: /files
        read_only: ${LOCAL_FILES_READ_ONLY:-false}
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
